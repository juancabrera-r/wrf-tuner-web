<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WRF Tuner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>WRF Tuner</h1>
      <p>Quick recommendation of <b>MPI ranks</b> and <b>time_step</b> (optimal/safe/risky).</p>
    </header>

    <section class="card">
      <h2>Input</h2>

      <div class="grid">
        <label>
          Number of domains
          <input id="domains" type="number" min="1" value="3" />
        </label>

        <label>
          e_we (per domain, d01, d02, ...)
          <input id="e_we" type="text" placeholder="74,112,220" value="74,112,220" />
        </label>

        <label>
          e_sn (per domain, d01, d02, ...)
          <input id="e_sn" type="text" placeholder="61,97,190" value="61,97,190" />
        </label>

        <label>
          dx_km (optional: 1 value or list)
          <input id="dx_km" type="text" placeholder="27 or 27,9,3" value="27,9,3" />
        </label>

        <label>
          min_patch (min tile)
          <input id="min_patch" type="number" min="4" value="10" />
        </label>
      </div>

      <div class="actions">
        <button id="runBtn">Calculate</button>
        <button id="exampleBtn" class="secondary">Example</button>
      </div>

      <p class="hint">
        Note: WRF typically uses a single <b>time_step</b> for the parent domain and scales it using the nesting ratio.
      </p>
    </section>

    <section class="card">
      <h2>Results</h2>
      <div id="output"></div>
    </section>

    <footer class="footer">
      <small>Made to run 100% in the browser. No backend.</small>
    </footer>
  </main>

  <script src="app.js?v=20260223-1"></script>
</body>
</html>
